# =============================================================================
# SafePaw OCI VM — Docker Compose (PostGIS + Redis + MinIO)
# =============================================================================
# 역할: VM 안에서 DB·캐시·이미지 저장소를 한 번에 기동하는 "설계도"
# Dockerfile 없음 — Hub 이미지 pull (Postgres/PostGIS 는 ARM용 imresamu/postgis)
#
# 서버에서 실행 (비밀번호는 .env.data 에 둠, yml 에 직접 쓰지 않음):
#   cd /opt/safepaw
#   docker-compose --env-file .env.data up -d
#
# 중지:
#   docker-compose --env-file .env.data down
#
# OCI ARM(aarch64): postgis/postgis 공식 이미지는 amd64 전용 → imresamu/postgis 사용
# =============================================================================

# services: 이 파일로 띄울 컨테이너(서비스) 목록
services:

  # ---------------------------------------------------------------------------
  # postgres — PostgreSQL + PostGIS (메인 DB)
  # ---------------------------------------------------------------------------
  # Spring Boot 가 jdbc:postgresql://127.0.0.1:5432/safepaw 로 접속
  # DB 이름·유저는 첫 기동 시 자동 생성 (테이블은 auth_tables.sql 로 별도)
  postgres:
    # image: PG16 + PostGIS 3.5 (공식 postgis/postgis 는 amd64 only → ARM VM 에서 exec format error)
    image: imresamu/postgis:16-3.5-bookworm
    # platform: OCI Ampere(aarch64) VM
    platform: linux/arm64
    # container_name: docker ps 에 보이는 이름
    container_name: safepaw-postgres
    # restart: VM 재부팅·컨테이너 비정상 종료 시 자동 재시작
    restart: unless-stopped
    environment:
      # POSTGRES_DB: 생성할 데이터베이스 이름 (수동 CREATE DATABASE 불필요)
      POSTGRES_DB: safepaw
      # POSTGRES_USER: DB 로그인 계정
      POSTGRES_USER: safepaw
      # POSTGRES_PASSWORD: .env.data 의 POSTGRES_PASSWORD 가 여기로 주입됨
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # "호스트IP:호스트포트:컨테이너포트"
      # 127.0.0.1 → VM 밖(인터넷)에서는 5432 접속 불가 (OCI·ufw 에도 안 염)
      - "127.0.0.1:5432:5432"
    volumes:
      # pgdata: 아래 volumes: 섹션에 정의된 이름 있는 디스크
      # 컨테이너 삭제해도 DB 데이터 유지
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # DB 가 연결 받을 준비됐는지 주기적으로 확인
      test: ["CMD-SHELL", "pg_isready -U safepaw -d safepaw"]
      interval: 10s   # 10초마다 검사
      timeout: 5s     # 5초 안에 응답 없으면 실패
      retries: 5      # 5번 연속 실패 시 unhealthy

  # ---------------------------------------------------------------------------
  # redis — Redis 7 (캐시·산책 세션·락 등)
  # ---------------------------------------------------------------------------
  # Spring: spring.data.redis.host=127.0.0.1, port=6379
  # OCI Security List / ufw 에 6379 열 필요 없음 (localhost 전용)
  redis:
    image: redis:7-alpine
    container_name: safepaw-redis
    restart: unless-stopped
    # command: redis-server 에 넘길 옵션 (> 는 YAML 여러 줄 문자열)
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    #   appendonly yes        — 디스크에 로그 저장 (재시작 후 데이터 유지)
    #   appendfsync everysec  — 1초마다 디스크 동기화
    #   maxmemory 512mb       — 최대 메모리 (VM 24GB 중 Redis 상한)
    #   maxmemory-policy      — 메모리 꽉 차면 오래된 키부터 삭제
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  # ---------------------------------------------------------------------------
  # minio — MinIO (S3 호환 오브젝트 스토리지 = 이미지 "버킷" 서버)
  # ---------------------------------------------------------------------------
  # OCI Object Storage 대신 VM 안에서 버킷 운영
  # Spring safepaw.storage: endpoint http://127.0.0.1:9000, public-endpoint 는 공인IP:9000
  minio:
    image: minio/minio:latest
    container_name: safepaw-minio
    restart: unless-stopped
    # server /data — 파일 저장 경로 (볼륨 miniodata 와 연결)
    # --console-address ":9001" — 웹 관리 콘솔 포트 (컨테이너 내부)
    command: server /data --console-address ":9001"
    environment:
      # MinIO 관리자 계정 (.env.data 의 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD)
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # 9000:9000 — 0.0.0.0 이므로 외부에서도 접근 가능 (OCI·ufw 9000 필요 시)
      - "9000:9000"
      # 9001 — 콘솔은 localhost 만 (SSH 터널로만 접속 권장)
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # minio-init — 버킷·CORS 초기화 (1회 실행 후 종료되는 보조 컨테이너)
  # ---------------------------------------------------------------------------
  # minio 본체는 "빈 창고"만 제공 → 여기서 dog-markers 등 폴더(버킷) 이름 생성
  # docker ps 에 Exited 로 보이면 정상 (로그: MinIO buckets + CORS ready)
  minio-init:
    image: minio/mc:latest
    container_name: safepaw-minio-init
    # depends_on: minio 가 healthy 될 때까지 대기 후 실행
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # entrypoint: 컨테이너 시작 시 실행할 셸 스크립트 한 덩어리
    # Compose 에서 $$ 는 컨테이너 안에서 $ 로 전달 (환경 변수 치환 방지)
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/dog-markers &&
      mc mb --ignore-existing local/share-cards &&
      mc mb --ignore-existing local/presets &&
      mc anonymous set download local/dog-markers &&
      mc anonymous set download local/share-cards &&
      mc anonymous set download local/presets &&
      printf '%s\n' '[{\"AllowedOrigin\":[\"*\"],\"AllowedMethod\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeader\":[\"*\"],\"ExposeHeader\":[\"ETag\"],\"MaxAgeSeconds\":3600}]' > /tmp/cors.json &&
      mc cors set local/dog-markers /tmp/cors.json &&
      mc cors set local/share-cards /tmp/cors.json &&
      mc cors set local/presets /tmp/cors.json &&
      echo 'MinIO buckets + CORS ready'
      "
    # mc alias set     — 같은 Compose 네트워크의 호스트명 "minio" 로 접속 설정
    # mc mb            — 버킷(폴더) 생성, --ignore-existing: 이미 있으면 스킵
    #   dog-markers    — 강아지·마커 이미지
    #   share-cards    — 산책 공유 카드 PNG
    #   presets        — 기본 마커 프리셋
    # mc anonymous set download — 버킷 공개 읽기 (이미지 URL GET)
    # mc cors set      — 앱/브라우저에서 PUT·GET 허용 (CORS)

# volumes: 위에서 이름만 쓴 디스크(pgdata 등)의 실제 저장 위치
# Docker 가 /var/lib/docker/volumes/... 에 관리 (컨테이너 삭제해도 데이터 유지)
volumes:
  pgdata:      # PostgreSQL 데이터 파일
  redisdata:   # Redis AOF·RDB
  miniodata:   # MinIO 업로드 파일
