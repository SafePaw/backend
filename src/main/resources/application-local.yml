safepaw:
  walk:
    calorie-coefficient: 1.1       # 강아지 칼로리 계수
    gps:
      max-accuracy-meters: 30      # 이보다 부정확하면 포인트 폐기
      min-speed-kmh: 1.0           # 정지로 간주
      max-speed-kmh: 12.0          # 사람 도보 상한
      jump-distance-meters: 100    # 점프 판정 거리
      jump-min-interval-seconds: 10
    batch:
      max-points: 60               # /points 한 번에 허용하는 최대 포인트(5분치)
    session:
      min-duration-seconds: 180    # 영토 인정 최소 산책 시간
      lock-ttl-hours: 2            # 단일 산책 락 TTL
      buffer-ttl-hours: 24         # Redis 버퍼/상태 TTL

  territory:
    loop-close-meters: 50          # R1 — 시작-종료 거리 임계
    min-points: 6                  # 폴리곤 최소 포인트
    min-width-meters: 15           # 최소 폭
    min-area-square-meters: 100    # 최소 면적
    concave-hull-target-percent: 0.72   # ST_ConcaveHull 자연스러움 (0~1)
    hull-simplify-tolerance-degrees: 0.000025
    bbox-max-area-square-meters: 50000000  # 조회 bbox 상한(50km²) — 초과 시 TERRITORY_BBOX_TOO_LARGE
    duplicate-window-hours: 24     # 24h 내 동일영역 재신청 차단

  jwt:
    access-expiration-minutes: 30
    refresh-expiration-days: 14

  oauth:
    kakao:
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
    google:
      token-uri: https://oauth2.googleapis.com/token

  dog:
    max-per-user: 5 # 한 사람이 소유할 수 있는 강아지 마릿수

  storage:
    provider: minio
    region: us-east-1
    endpoint: http://127.0.0.1:9000
    public-endpoint: http://127.0.0.1:9000
    access-key: ${MINIO_ROOT_USER:safepaw}
    secret-key: ${MINIO_ROOT_PASSWORD:changeme}
    path-style-access: true
    bucket-markers: dog-markers
    bucket-share-cards: share-cards
    bucket-presets: presets
    public-base-url: http://127.0.0.1:9000

spring:
  config:
    import: classpath:application-secret.yml

  # 데이터베이스 postgres 사용 및 도커 내부에서 5432 포트로 받음
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/safepaw?sslmode=prefer

  # redis 6379 포트
  data:
    redis:
      host: 127.0.0.1
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update   # 로컬만 — Entity 기준 테이블 자동 생성