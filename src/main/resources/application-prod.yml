spring:
  config:
    import: optional:classpath:application-secret.yml

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/safepaw?sslmode=prefer
    username: safepaw
    password: ${POSTGRES_PASSWORD}

  # redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8080
  forward-headers-strategy: framework # swagger https

management:
  endpoints:
    web:
      exposure:
        include: health,info

safepaw:
  fcm:
    enabled: true
    credentials-json-base64: ${FIREBASE_CREDENTIALS_JSON_BASE64}

  notification:
    season-reminder:
      enabled: true
      cron: "0 0 9 * * *"
      zone: Asia/Seoul

  walk:
    calorie-coefficient: 1.1       # 강아지 칼로리 계수
    gps:
      max-accuracy-meters: 30      # 이보다 부정확하면 포인트 폐기
      min-speed-kmh: 1.0           # 정지로 간주
      max-speed-kmh: 12.0          # 사람 도보 상한
      jump-distance-meters: 100    # 점프 판정 거리
      jump-min-interval-seconds: 10
    batch:
      max-points: 60               # /points 한 번에 허용하는 최대 포인트(5분치)
    session:
      min-duration-seconds: 180    # 영토 인정 · 산책 완료 XP 최소 시간
      lock-ttl-hours: 2            # 단일 산책 락 TTL
      buffer-ttl-hours: 24         # Redis 버퍼/상태 TTL
      min-xp-area-square-meters: 50  # 산책 완료 XP 최소 면적 (영토 최소 100㎡와 별개)

  territory:
    loop-close-meters: 50
    min-points: 6
    min-width-meters: 15
    min-area-square-meters: 100
    path-simplify-tolerance-degrees: 0.0001
    polygon-simplify-tolerance-degrees: 0.00005
    min-polygon-part-area-square-meters: 20
    bbox-max-area-square-meters: 50000000
    duplicate-window-hours: 24

  jwt:
    access-expiration-minutes: 30
    refresh-expiration-days: 14

  oauth:
    kakao:
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
    google:
      token-uri: https://oauth2.googleapis.com/token

  storage:
    provider: minio
    region: us-east-1
    endpoint: http://127.0.0.1:9000
    public-endpoint: ${SAFEPAW_STORAGE_PUBLIC_URL}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    path-style-access: true
    bucket-markers: dog-markers
    bucket-share-cards: share-cards
    bucket-presets: presets
    public-base-url: ${SAFEPAW_STORAGE_PUBLIC_URL}

  dog:
    max-per-user: 5

  crew:
    max-members: 20
    invite-code-length: 8