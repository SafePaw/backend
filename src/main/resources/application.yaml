#file: noinspection YAMLSchemaValidation
spring:
  application:
    name: safepaw-api
  profiles:
    active: local

# api root
server:
  servlet:
    context-path: /

# ddl auto 추후 변경 예정
spring.jpa:
  open-in-view: false
  hibernate:
    ddl-auto: validate
  properties:
    hibernate:
      jdbc:
        time_zone: Asia/Seoul
      format_sql: true

# 서버 상태 모니터링
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# JWT·OAuth·Redis·Supabase URL 은 프로필별 yml 또는 env